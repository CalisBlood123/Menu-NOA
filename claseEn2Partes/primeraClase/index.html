<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Formulario de contacto de Mi Sitio Web">
    <title>Contacto | Mi Sitio Web</title>
</head>

<body>
    <main class="page-shell">
        <section class="contact-card" aria-labelledby="contact-title">
            <header class="intro">
                <p class="eyebrow">Hablemos</p>
                <h1 id="contact-title">Crea tu cuenta</h1>
                <p>Crea tu cuenta y te contactaremos.</p>
            </header>

            <form onsubmit="registrarUsuario(event)">
                <div class="form-field">

                    <label for="name"> Nombre:
                        <input type="text" id="name" name="name" placeholder="Nombre" autocomplete="name" required>
                    </label>

                    <label for="age"> Nombre:
                        <input type="number" id="age" placeholder="edad" required>
                    </label>
                    

                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="email" required>

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="contraseña" autocomplete="email" required>

                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="confirmar contraseña" autocomplete="email" required>

                </div>

                <button>Crear usuario</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Mi Sitio Web</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
